  <rect width="512" height="512" fill="url(#g)"/>
  <g transform="translate(256,256) scale(1.55)">
    <ellipse cx="0" cy="38" rx="92" ry="28" fill="#2b2740" opacity="0.18"/>
    <rect x="-74" y="-96" width="148" height="168" rx="22" fill="url(#g2)" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2"/>
    <rect x="-52" y="-68" width="104" height="14" rx="7" fill="#7c5cff" opacity="0.95"/>
    <rect x="-52" y="-42" width="84" height="10" rx="5" fill="#7c5cff" opacity="0.55"/>
    <rect x="-52" y="-18" width="96" height="10" rx="5" fill="#7c5cff" opacity="0.35"/>
    <rect x="-52" y="6" width="72" height="10" rx="5" fill="#7c5cff" opacity="0.25"/>
    <circle cx="48" cy="-82" r="10" fill="#f5b942" stroke="#fff" stroke-width="3"/>
  </g>
</svg>
